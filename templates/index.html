<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Chatbot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 h-[100dvh] flex flex-col justify-between max-w-2xl mx-auto shadow-lg">
    <!-- Header -->
    <div class="p-3 sm:p-4 bg-blue-600 text-white font-bold text-center text-sm sm:text-base shadow-md">
        Go Simple Chatbot
    </div>

    <!-- Area Pesan (Responsive Scrolling) -->
    <div id="chat-box" class="flex-1 p-3 sm:p-4 overflow-y-auto space-y-3 text-sm sm:text-base">
        <div class="bg-white p-3 rounded-lg shadow max-w-[85%] sm:max-w-[75%] w-fit">
            Halo! Ada yang bisa saya bantu?
        </div>
    </div>

    <!-- Input Form (Sticky/Fixed di bawah saat mobile) -->
    <div class="p-3 sm:p-4 bg-white border-t flex gap-2 items-center">
        <input type="text" id="user-input" placeholder="Ketik pesan..."
            class="flex-1 border rounded-lg px-3 py-2 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="sendMessage()"
            class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm sm:text-base hover:bg-blue-700 transition">
            Kirim
        </button>
    </div>

    <script>
        let conversationId = localStorage.getItem('conversation_id') || null;

        async function loadHistory() {
            if (!conversationId) return;

            try {
                let response = await fetch(`/conversations/${conversationId}/messages`);
                if (!response.ok) {
                    conversationId = null;
                    localStorage.removeItem('conversation_id');
                    return;
                }
                let messages = await response.json();

                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML = '';

                messages.forEach(msg => {
                    let role = msg.role;
                    let content = msg.parts[0].text;
                    if (role === 'user') {
                        chatBox.innerHTML += `<div class="bg-blue-100 p-3 rounded-lg shadow max-w-[85%] sm:max-w-[75%] w-fit ml-auto break-words">${escapeHtml(content)}</div>`;
                    } else {
                        chatBox.innerHTML += `<div class="bg-white p-3 rounded-lg shadow max-w-[85%] sm:max-w-[75%] w-fit break-words">${escapeHtml(content)}</div>`;
                    }
                });
                const chatBoxElem = document.getElementById('chat-box');
                chatBoxElem.scrollTop = chatBoxElem.scrollHeight;
            } catch (error) {
                console.error('Failed to load history:', error);
                conversationId = null;
                localStorage.removeItem('conversation_id');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if (!input.value.trim()) return;

            let message = input.value;

            chatBox.innerHTML += `<div class="bg-blue-100 p-3 rounded-lg shadow max-w-[85%] sm:max-w-[75%] w-fit ml-auto break-words">${escapeHtml(message)}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                let payload = { message: message };
                if (conversationId) {
                    payload.conversation_id = conversationId;
                }
                let response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                let data = await response.json();

                if (!conversationId) {
                    conversationId = data.conversation_id;
                    localStorage.setItem('conversation_id', conversationId);
                }

                chatBox.innerHTML += `<div class="bg-white p-3 rounded-lg shadow max-w-[85%] sm:max-w-[75%] w-fit break-words">${escapeHtml(data.answer)}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div class="bg-red-100 text-red-600 p-3 rounded-lg shadow max-w-[85%] w-fit">Gagal terhubung ke server.</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = loadHistory;
    </script>
</body>

</html>
